services:
  database:
    build:
      context: ./database
      args:
        H2_VERSION: 2.4.240
    environment:
      H2_USER: ${H2_USER:-sa}
      H2_PASSWORD: ${H2_PASSWORD:-password}
      H2_DATABASE: ${H2_DATABASE:-userdb}
    volumes:
      - h2-data:/data
    expose:
      - "9092"
    healthcheck:
      test: ["CMD-SHELL", "java -cp /opt/h2/h2.jar org.h2.tools.Shell -url 'jdbc:h2:tcp://localhost:9092//data/$${H2_DATABASE}' -user '$${H2_USER}' -password '$${H2_PASSWORD}' -sql 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:h2:tcp://database:9092//data/${H2_DATABASE:-userdb}
      DB_USER: ${H2_USER:-sa}
      DB_PASSWORD: ${H2_PASSWORD:-password}
    depends_on:
      database:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "4200:80"
    restart: unless-stopped

volumes:
  h2-data:

